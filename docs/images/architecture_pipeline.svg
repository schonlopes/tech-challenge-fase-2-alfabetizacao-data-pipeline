<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura da pipeline híbrida de alfabetização</title>
  <desc id="description">Fontes oficiais e eventos entram em uma arquitetura Medalhão Bronze, Silver e Gold, com consumo analítico, exportação Parquet e monitoramento.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .label{font-family:Arial,sans-serif;font-size:16px;font-weight:700;fill:#0f172a}.small{font-family:Arial,sans-serif;font-size:13px;fill:#334155}.group{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#0e7490}.node{stroke-width:2}.arrow{stroke:#64748b;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#f8fafc"/>
  <text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Pipeline híbrida de alfabetização</text>
  <text x="48" y="78" font-family="Arial,sans-serif" font-size="15" fill="#475569">Batch e streaming com arquitetura Medalhão, qualidade e observabilidade.</text>

  <text class="group" x="48" y="130">FONTES</text>
  <rect class="node" x="48" y="150" width="185" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="70" y="182">Base dos Dados</text><text class="small" x="70" y="205">6 tabelas no BigQuery</text>
  <rect class="node" x="48" y="258" width="185" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="70" y="290">Eventos de alunos</text><text class="small" x="70" y="313">simulador streaming</text>
  <rect class="node" x="48" y="366" width="185" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="label" x="70" y="398">Diretório municipal</text><text class="small" x="70" y="421">Base dos Dados</text>

  <text class="group" x="288" y="130">INGESTÃO</text>
  <rect class="node" x="288" y="150" width="175" height="80" rx="12" fill="#f0fdfa" stroke="#0d9488"/>
  <text class="label" x="310" y="182">Scheduled Queries</text><text class="small" x="310" y="205">batch diário</text>
  <rect class="node" x="288" y="258" width="175" height="80" rx="12" fill="#f0fdfa" stroke="#0d9488"/>
  <text class="label" x="310" y="290">Pub/Sub</text><text class="small" x="310" y="313">streaming direto</text>
  <rect class="node" x="288" y="366" width="175" height="80" rx="12" fill="#fff1f2" stroke="#e11d48"/>
  <text class="label" x="310" y="398">DLQ</text><text class="small" x="310" y="421">eventos inválidos</text>

  <text class="group" x="520" y="130">LAKEHOUSE MEDALHÃO</text>
  <rect class="node" x="520" y="150" width="180" height="80" rx="12" fill="#fdf3e7" stroke="#a86b32"/>
  <text class="label" x="542" y="182">Bronze</text><text class="small" x="542" y="205">histórico e eventos</text>
  <rect class="node" x="760" y="150" width="180" height="80" rx="12" fill="#edf2f7" stroke="#94a3b8"/>
  <text class="label" x="782" y="182">Silver</text><text class="small" x="782" y="205">tipos, chaves e DQ</text>
  <rect class="node" x="1000" y="150" width="160" height="80" rx="12" fill="#fef9c3" stroke="#d4af37"/>
  <text class="label" x="1022" y="182">Gold</text><text class="small" x="1022" y="205">indicadores e metas</text>

  <text class="group" x="760" y="300">CONSUMO E CONTROLE</text>
  <rect class="node" x="760" y="320" width="180" height="80" rx="12" fill="#eef2ff" stroke="#6366f1"/>
  <text class="label" x="782" y="352">BigQuery / BI</text><text class="small" x="782" y="375">consulta analítica</text>
  <rect class="node" x="980" y="320" width="180" height="80" rx="12" fill="#eef2ff" stroke="#6366f1"/>
  <text class="label" x="1002" y="352">Cloud Storage</text><text class="small" x="1002" y="375">Parquet Snappy</text>
  <rect class="node" x="760" y="440" width="400" height="62" rx="12" fill="#f1f5f9" stroke="#64748b"/>
  <text class="label" x="782" y="468">Monitoring e FinOps</text><text class="small" x="782" y="489">qualidade, backlog, DLQ, jobs e custo</text>

  <path class="arrow" d="M233 190 H288"/><path class="arrow" d="M233 298 H288"/><path class="arrow" d="M233 406 H760 V230"/>
  <path class="arrow" d="M463 190 H520"/><path class="arrow" d="M463 298 H520"/><path class="arrow" d="M375 338 V366"/>
  <path class="arrow" d="M700 190 H760"/><path class="arrow" d="M940 190 H1000"/>
  <path class="arrow" d="M1080 230 V320 H850"/><path class="arrow" d="M1080 230 V320 H1070"/>
  <path class="arrow" d="M610 230 V440 H760"/><path class="arrow" d="M850 230 V440"/><path class="arrow" d="M1080 230 V440"/>
</svg>
